<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            div{
                width: 100px;
                height: 100px;
                background-color: red;
                border: 2px solid #000

                display: inline;
            }
            h1, {
                display: inline;
            }

            span{
                display: block;
                width: 100px;
                height: 100px;
                background-color: yellow;
            }
            img{
                display: block;
            }

            /* block: 브라우저의 전체를 차지 p h form ul li */
            /* inline: 그 요소의 공간만 차지 span img b i em strong input */
            /* inline-block: inline속성과 block 속성을 가지도 있다. */
        </style>
    </head>
    <body>
        <!-- 믈록/인라인 -->
        <div>믈록</div>
        <div>믈록</div>
        <div>믈록</div>
        <div>믈록</div>
        <div>믈록</div>

        <h1>dfdfdffdfdfdfdffdf</h1>
        <p>sdfjdfjdfjdfjdjfdjdj</p>

        <span>돔해물과</span><span>백두산이</span><span>마르고 닳도록</span>

        <hr />
        <img src="../image/brid.jpg" alt="width=" 200 />
        <img src="../image/Button.jpg" alt="width=200" />
        <img src="../image/coffee.jpg" alt="width=200" />
        <img src="../image/coffee.jpg" alt="width=200" />
        <img src="../image/Galaxy.jpg" alt="width=200" />
    </body>
</html>
