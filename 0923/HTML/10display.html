                /* 투명도: 0~100% */
            }
        </style>
    </head>
    <body>
        <div>햄버거 빵</div>
        <div class="cheese">치즈</div>
        <div>소고시 패티</div>
        <div class="toamto">토마토</div>
        <div class="yang">양상추</div>
        <div>햄버거 빵</div>
    </body>
</html>
