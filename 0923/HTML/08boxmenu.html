<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            * {
                margin: 0;
                width: 0;
            }
            li {
                list-style: none;
            }
            #wrap {
                width: 500px;
                height: 600px;
                background-color: gray;
                /*margin: 0 auto;
                 가운데 배치: 암기 */

                padding: 30px;
            }
            li {
                width: 100px;
                height: 100px;
                float: left;
                margin: 10px;
            }
            li:nth-child(1) {
                background-color: red;
            }
            li:nth-child(2) {
                background-color: orange;
            }
            li:nth-child(3) {
                background-color: yellow;
            }
            li:nth-child(4) {
                background-color: green;
            }
            li:nth-child(5) {
                background-color: navy;
            }
        </style>
    </head>
    <body>
        <div>
            id="wrap"
            <ul>
                <li>menu01</li>
                <li>menu02</li>
                <li>menu03</li>
                <li>menu04</li>
                <li>menu05</li>
            </ul>
        </div>
    </body>
</html>
