<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=, initial-scale=1.0" />
        <title>Document</title>
        <style>
            /*reset*/

            div {
                width: 100px;
                height: 100px;
                text-align: center;
                line-height: 100px;
                font-weight: bold;
            }
            div:nth-child(1) {
                color: red;
            }
            div:nth-child(2) {
                color: aqua;
                margin: 20px 10px;
                /* magine: top right bottom left */
                /* margine-top: 20px; 
                margin-left: 20px;
                margin-bottom: 20px;
                margin-right: 20px;*/
            }
            div:nth-child(3) {
                color: yellow;
                background-color: green;
                padding: 20px;
            }
            div:nth-child(4) {
                color: green;
                background-color: blue;
                border: 10px solid #000;
            }
            div:nth-child(5) {
                color: purple;
                background-color: purple;
                margin: 20px;
                padding: 20px;
                border: 10px soild #000;
            }

            /* total width= content의 width 값+(margine+padding+boder)X2 */

            #big {width: 200px;
            height: 200px;
            background-color: skyblue;
            padding: 30px;
        }
        #small
        {width: 100px;
            height: 100px;
            background-color: blue;
        }

        </style>
    </head>
    <body>
        <div>box1</div>
        <div>box2</div>
        <div>box3</div>
        <div>box4</div>
        <div>box5</div>

        <select id="big"></select>
        <select id="small"></select>
        </select>
    </body>
</html>
